[project]
name = "generation-eval"
version = "0.1.0"
description = "Generation evaluation for RAG answers: RAGAS, DeepEval, Sentence Transformers, SacreBLEU, rouge-score, FastAPI and Langfuse"
readme = "README.md"
authors = [
    { name = "Balaji-del-dev", email = "mrbalamurugan818@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval==4.3.3",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "langchain-community<0.4",
    "langfuse>=3",
    "numpy>=1.26",
    "ollama>=0.4",
    "openai>=1.60",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "ragas==0.4.3",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
generation-eval = "generation_eval:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/fastapi_service"]
addopts = "-q"
markers = [
    "models: loads a Sentence Transformers model (set RUN_MODEL_TESTS=1)",
    "live: calls the real RAGAS / DeepEval judges through Ollama (set RUN_LIVE=1)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
