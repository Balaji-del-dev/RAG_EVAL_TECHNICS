{% spaceless %}<span class="math">{% for p in parts %}{% if p.frac %}<span class="frac"><span class="frac__num">{{ p.frac.0 }}</span><span class="visually-hidden"> divided by </span><span class="frac__den">{{ p.frac.1 }}</span></span>{% elif p.sum %}<span class="bigop"><span class="visually-hidden">sum from {{ p.sum.0 }} to {{ p.sum.1 }} of</span><span class="bigop__sup" aria-hidden="true">{{ p.sum.1 }}</span><span class="bigop__sym" aria-hidden="true">&Sigma;</span><span class="bigop__sub" aria-hidden="true">{{ p.sum.0 }}</span></span>{% else %}<span>{{ p.t }}</span>{% endif %}{% endfor %}</span>{% endspaceless %}
